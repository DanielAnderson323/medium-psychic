    <!-- Inject page links into React navigation -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Wait for React to render
        const injectNav = () => {
            const desktopNav = document.querySelector('nav .hidden.md\\:flex');
            const mobileMenu = document.querySelector('nav + div .flex.flex-col');
            if (!desktopNav) {
                setTimeout(injectNav, 200);
                return;
            }

            const pageLinks = [
                { label: 'Our Mediums', href: 'https://medium-psychic.net/our-mediums/' },
                { label: 'What to Expect', href: 'https://medium-psychic.net/what-to-expect/' },
                { label: 'Blog', href: 'https://medium-psychic.net/blog/' }
            ];

            // Add divider + page links to desktop nav
            const divider = document.createElement('span');
            divider.style.cssText = 'width:1px;height:14px;background:rgba(255,255,255,0.15);';
            desktopNav.appendChild(divider);

            pageLinks.forEach(link => {
                const a = document.createElement('a');
                a.href = link.href;
                a.textContent = link.label;
                a.className = 'text-sm text-secondary-light hover:text-primary-light transition-colors relative group';
                const underline = document.createElement('span');
                underline.className = 'absolute -bottom-1 left-0 w-0 h-px bg-lavender group-hover:w-full transition-all duration-300';
                a.appendChild(underline);
                desktopNav.appendChild(a);
            });

            // Add to mobile menu
            if (mobileMenu) {
                pageLinks.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.href;
                    a.textContent = link.label;
                    a.className = 'text-2xl font-display text-primary-light hover:text-lavender transition-colors';
                    mobileMenu.appendChild(a);
                });
            }
        };
        setTimeout(injectNav, 500);
    });
    </script>
